[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kennel"
version = "0.0.2"
description = "Lightweight local agent runtime, Python SDK and CLI for Apple Foundation Models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hiromu OCHIAI" }]
keywords = ["apple", "foundation-models", "agent", "on-device", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# apple-fm-sdk 0.2.1 needs the macOS 27 SDK (Xcode 27); with Xcode 26.x its Swift bridge
# fails to build. Lift the upper bound once a matching Xcode is common.
dependencies = [
    "apple-fm-sdk>=0.2.0,<0.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
kennel = "kennel.cli.main:main"

[project.urls]
Homepage = "https://github.com/otiai10/kennel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "apple: requires Apple Foundation Models on this Mac (set KENNEL_APPLE_TESTS=1 to run)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
